<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            font-family: Arial, Helvetica, sans-serif;
        }

        .parent {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            gap: 25px;
        }

        .userInput {
            width: 400px;
            height: 30px;
        }

        h1 {
            font-size: 35px;
        }

        h2 {
            font-size: 20px;
        }

        .bar {
            width: 400px;
            height: 8px;
            border-radius: 20px;
            background-color: #444;
        }

        .bar-fill {
            height: 8px;
            border-radius: 20px;
            background-color: #444;
            transition: 0.7s;
        }

        .strengthParent {
            width: 400px;
            display: flex;
            justify-content: start;
        }

        .strength {
            text-align: start;
            margin-left: 15px;
        }
    </style>
</head>

<body>

    <div class="parent">
        <h1>Password Strength Checker</h1>

        <div class="container">
            <input type="password" class="userInput" placeholder="Enter Password..">
        </div>

        <div class="strengthParent">
            <h2 class="strength">Strength :</h2>
        </div>

        <div class="bar">
            <div class="bar-fill">
            </div>
        </div>
    </div>

    <script>

        let password = document.querySelector('.userInput');
        let strength = document.querySelector('.strength');
        let bar = document.querySelector('.bar-fill');
        let widthVal = 0;
        let background = "";

        password.addEventListener('input', () => {

            let score = 0;
            let pass = password.value;
            let passLen = password.value.length;
            if (passLen < 5 && passLen > 0) {
                strength.innerText = "Minimum 5 characters required";
                background = "#444"; widthVal = "100px";
                updateScore(score);
            }

            else {
                strength.innerText = "Strength :-";

                if (/[A-Z]/.test(pass)) { score++; }
                if (/[a-z]/.test(pass)) { score++; }
                if (/[0-9]/.test(pass)) { score++; }
                if (/[^A-Za-z0-9]/.test(pass)) { score++; }
                updateScore(score, passLen);
            }
        });

        function updateScore(score, passLen) {

            if (passLen <= 0) { background = "#444", widthVal = "100px" }

            if (score === 1) { background = "red"; widthVal = "100px"; strength.innerText = `Strength :- Weak`; }
            if (score === 2) { background = "orange"; widthVal = "200px"; strength.innerText = `Strength :- Medium`; }
            if (score === 3) { background = "lightgreen"; widthVal = "300px"; strength.innerText = `Strength :- Strong`; }
            if (score >= 4) { background = "green"; widthVal = "400px"; strength.innerText = `Strength :- Very Strong`; }

            bar.style.background = background;
            bar.style.width = widthVal;
        };

    </script>
</body>

</html>
