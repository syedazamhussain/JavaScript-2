<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API</title>
    <style>
        body {
            background-color: #E8FFF4;
            border: 4px solid #059669;
            height: 300px;
            margin: 30px;
        }

        h1 {
            text-align: center;
            text-decoration: underline;
            font-size: 35px;
        }

        .msg {
            text-align: center;
            font-size: 30px;
            font-family: 'Inter', sans-serif;

        }
    </style>
</head>

<body>

    <h1>
        Joke For You.......
    </h1>
    <div class="msg">I am here.... </div>
    <script>
        let msg = document.querySelector('.msg');
        fetch("https://official-joke-api.appspot.com/random_joke")
            .then(data => data.json())
            .then(finalData => {
                setTimeout(() => {
                    msg.innerHTML = `<p>${finalData.setup}</p> <p> ${finalData.punchline}</p>`;
                }, 1000);
            })
            .catch(err => console.log("Not Able to fetch data", err))

    </script>

</body>

</html>
